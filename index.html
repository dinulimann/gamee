<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>CV Quest</title>
  <meta name="description" content="Dinul Iman — Backend & Full-stack Developer. CV interaktif berbentuk game RPG: jelajahi desa, kumpulkan skill, dan tanya Robot Claude." />
  <meta name="theme-color" content="#1d5f9c" />
  <!-- preview saat link dibagikan (WhatsApp, LinkedIn, X, dll.) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Dinul Iman — CV Quest" />
  <meta property="og:description" content="Backend & Full-stack Developer · Payroll, PostgreSQL, Oracle, NestJS. Jelajahi CV interaktif berbentuk game RPG!" />
  <meta property="og:image" content="assets/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Dinul Iman — CV Quest" />
  <meta name="twitter:image" content="assets/og.png" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="loader">
    <div class="loader-box">
      <div class="loader-title">CV QUEST</div>
      <div class="loader-bar"><i id="loaderBar"></i></div>
      <div class="loader-text">Memuat desa… · Loading the village…</div>
    </div>
  </div>

  <canvas id="game" aria-label="Dunia game CV"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-left panel">
      <div class="avatar" id="hudAvatar"></div>
      <div>
        <div class="hud-name" id="hudName"></div>
        <div class="hud-role" id="hudRole"></div>
      </div>
    </div>
    <div class="hud-right">
      <button class="icon-btn panel" id="btnQuest" data-i18n-title="tQuest">📜</button>
      <button class="icon-btn panel" id="btnCV" data-i18n-title="tCV">📄</button>
      <button class="icon-btn panel lang-btn" id="btnLang" data-i18n-title="tLang">ID</button>
      <button class="icon-btn panel" id="btnSettings" data-i18n-title="tSettings">⚙️</button>
      <button class="icon-btn panel" id="btnHelp" data-i18n-title="tHelp">❔</button>
    </div>
    <div id="settings" class="panel hidden" role="menu">
      <button class="set-row" data-action="sound" data-i18n-title="tSound"><span data-i18n="sSound"></span><b id="setSoundVal"></b></button>
      <button class="set-row" data-action="music" data-i18n-title="tMusic"><span data-i18n="sMusic"></span><b id="setMusicVal"></b></button>
      <button class="set-row" data-action="time" data-i18n-title="tTime"><span data-i18n="sTime"></span><b id="setTimeVal"></b></button>
      <button class="set-row" data-action="weather"><span data-i18n="sWeather"></span><b id="setWeatherVal"></b></button>
      <button class="set-row" data-action="terminal" data-i18n-title="tTerminal"><span data-i18n="sTerminal"></span><b>💻</b></button>
    </div>
    <div class="hud-progress panel" id="hudProgress"></div>
  </div>

  <canvas id="minimap" class="panel hidden" data-i18n-title="tMinimap"></canvas>

  <div id="prompt" class="panel hidden"></div>
  <button id="actionBtn" class="hidden" aria-label="Interaksi">💬</button>

  <div id="toasts" aria-live="polite"></div>

  <!-- Dialog NPC -->
  <div id="dialog" class="panel hidden" role="dialog" aria-live="polite">
    <div class="dialog-name" id="dialogName"></div>
    <div class="dialog-text" id="dialogText"></div>
    <div class="dialog-hint" data-i18n="dialogHint">▼ ketuk / E</div>
  </div>

  <!-- Modal umum -->
  <div id="modal" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-head">
        <span class="modal-icon" id="modalIcon"></span>
        <h2 id="modalTitle"></h2>
        <button class="close-btn" data-close data-i18n-title="close">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Panel misi -->
  <div id="quest" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-card" style="--accent:#f2c14e">
      <div class="modal-head">
        <span class="modal-icon">📜</span>
        <h2 data-i18n="questTitle">Misi & Pencapaian</h2>
        <button class="close-btn" data-close data-i18n-title="close">✕</button>
      </div>
      <div class="modal-body" id="questBody"></div>
    </div>
  </div>

  <!-- CV klasik -->
  <div id="classic" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="classic-card">
      <div class="classic-bar">
        <a class="btn" id="btnPdf" href="#" download data-pdf>⬇️ PDF</a>
        <button class="btn ghost" id="btnPrint" data-i18n="print">🖨️ Cetak / PDF</button>
        <button class="btn ghost" data-close data-i18n="back">✕ Kembali ke game</button>
      </div>
      <div id="classicBody"></div>
    </div>
  </div>

  <!-- Terminal rahasia -->
  <div id="terminal" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Terminal">
    <div class="term-card">
      <div class="term-bar"><i></i><i></i><i></i><span>dinul@cv-quest: ~</span></div>
      <div class="term-out" id="termOut"></div>
      <form class="term-line" id="termForm" autocomplete="off">
        <label for="termInput">dinul@cv-quest:~$</label>
        <input id="termInput" spellcheck="false" autocapitalize="off" autocomplete="off" />
      </form>
    </div>
  </div>

  <!-- Layar judul -->
  <div id="title" class="overlay">
    <div class="title-card">
      <div class="lang-switch" role="group" aria-label="Bahasa / Language">
        <button type="button" data-lang="id">🇮🇩 Indonesia</button>
        <button type="button" data-lang="en">🇬🇧 English</button>
      </div>
      <div class="title-badge">CV QUEST</div>
      <div class="avatar huge" id="titleAvatar"></div>
      <h1 id="titleName"></h1>
      <p class="title-role" id="titleRole"></p>
      <p class="title-tag" id="titleTag"></p>
      <div class="title-actions">
        <button class="btn big" id="btnStart">▶ Mulai Petualangan</button>
        <button class="btn ghost" id="btnStartClassic" data-i18n="startClassic">📄 Lihat CV Biasa</button>
      </div>
      <div class="controls">
        <div data-i18n-html="ctrlWalk"></div>
        <div data-i18n-html="ctrlAct"></div>
        <div data-i18n-html="ctrlClick"></div>
      </div>
    </div>
  </div>

  <script>
    // Vercel Web Analytics: hanya dimuat saat situs berjalan di server (bukan file lokal)
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    if (/^https?:$/.test(location.protocol) && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
      var va = document.createElement('script'); va.defer = true; va.src = '/_vercel/insights/script.js';
      document.head.appendChild(va);
    }
  </script>
  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
